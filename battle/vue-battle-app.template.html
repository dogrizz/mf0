<div class="root">
  <div class="topbar">
    <div class="topbar-heading">
      <span class="eyebrow">MF0 &middot; Intercept Orbit</span>
      <h1 class="h1">Battle tracker</h1>
    </div>
    <options-link />
  </div>
  <template v-if="!state.battle">Can't find your battle</template>
  <template v-else>
    <div class="scoreboard-section">
      <div class="eyebrow">Scoreboard</div>
      <div class="scoreboard">
        <battle-player
          v-for="(player, i) in state.battle.roster"
          :key="i"
          :player="player"
          :battle="state.battle"
          :accent="fleetAccent(i)"
        />
      </div>
    </div>
    <div v-if="state.battle.sync" class="fleet-list">
      <battle-fleet v-for="(fleet, i) in state.battle.roster" :key="i" :fleet="fleet" :battle="state.battle" :accent="fleetAccent(i)" />
    </div>
  </template>
  <app-footer />
</div>
