<div class="tactical-page">
  <div class="topbar">
    <div class="topbar-heading">
      <span class="eyebrow">MF0 &middot; Intercept Orbit</span>
      <h1 class="h1">Battle tracker</h1>
    </div>
    <options-link />
  </div>
  <template v-if="!state.battle">
    <p class="empty-state">Can't find your battle</p>
  </template>
  <template v-else>
    <div class="fleet-section">
      <div class="eyebrow section-label">Scoreboard</div>
      <div class="scoreboard">
        <battle-player v-for="(player, i) in state.battle.roster" :key="i" :player="player" :battle="state.battle" :index="i" />
      </div>
    </div>
    <div v-if="state.battle.sync" class="fleets">
      <battle-fleet v-for="(fleet, i) in state.battle.roster" :key="i" :fleet="fleet" :battle="state.battle" :index="i" />
    </div>
  </template>
  <app-footer />
</div>
