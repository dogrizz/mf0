<div class="stat-card">
  <div class="stat-card-name"><span class="fleet-dot" :style="{ background: fleetColor }"></span>{{ player.name }}</div>
  <div class="field-row">
    <div class="field">
      <label>HVA</label>
      <input type="number" min="0" :value="player.hva" @input="changeHva($event.target.value)" />
    </div>
    <div class="field">
      <label>TAs</label>
      <input type="number" min="0" :disabled="battle.sync" :value="player.tas" @input="changeTas($event.target.value)" />
    </div>
  </div>
  <div class="stat-readout-row">
    <div class="stat-readout"><span class="v mono">{{ player.ppa }}</span><span class="k">PPA</span></div>
    <div class="stat-readout"><span class="v mono">{{ player.total }}</span><span class="k">Total</span></div>
    <span class="badge" :class="roleBadgeClass">{{ player.role }}</span>
  </div>
</div>
