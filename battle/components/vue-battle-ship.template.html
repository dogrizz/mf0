<div class="ship asset-card" :class="ship.destroyed ? 'dead is-dead' : ''">
  <div class="asset-card-head">
    <h4
      class="asset-name"
      :class="isCaptured ? 'captured' : ''"
      :title="ship.name + (ship.destroyed ? ' dead ' : ' ') + (isCaptured ? 'captured' : '')"
    >{{ ship.name || 'noname' }}</h4>
    <span v-if="ship.destroyed" class="badge badge-destroyed">Destroyed</span>
    <span v-else-if="isCaptured" class="badge badge-captured">Captured &middot; ex {{ capturedFromName }}</span>
    <button
      v-if="!ship.destroyed"
      type="button"
      class="icon-btn"
      title="Transfer to another fleet"
      aria-label="Transfer ship"
      @click="startTransfer"
    >
      <svg viewBox="0 0 20 20" fill="none">
        <path d="M4 7h11M15 7l-3-3M15 7l-3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M16 13H5M5 13l3-3M5 13l3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
  </div>
  <span class="chip">{{ diceText }}</span>
  <div class="system-list">
    <label v-for="(system, i) in ship.systems" :key="i" class="system-row" :class="system.disabled ? 'is-disabled' : ''">
      <span class="system-icon" v-html="systemIcon(system.class)"></span>
      <span class="system-label">{{ systemText(system) }}</span>
      <input
        class="system-check"
        type="checkbox"
        :checked="system.disabled"
        @click="systemStateChange(system, $event.target.checked)"
      />
    </label>
  </div>
  <div v-if="ship.showPopup" class="transfer-overlay">
    <div class="transfer-dialog">
      <div class="transfer-dialog-handle"></div>
      <div class="transfer-dialog-head">
        <h3 class="transfer-dialog-title">Transfer &ldquo;{{ ship.name }}&rdquo;</h3>
        <button type="button" class="icon-btn" aria-label="Cancel transfer" @click="cancelTransfer">
          <svg viewBox="0 0 20 20" fill="none">
            <path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        </button>
      </div>
      <span class="transfer-dialog-sub">Send this ship to:</span>
      <button
        v-for="(target, i) in otherFleets()"
        :key="i"
        type="button"
        class="btn transfer-target"
        @click="pickTransferTarget(target)"
      >
        <span class="fleet-dot" :style="{ background: fleetColorFor(target) }"></span> {{ target.name }}
      </button>
      <button type="button" class="btn btn-ghost transfer-cancel" @click="cancelTransfer">Cancel</button>
    </div>
  </div>
</div>
