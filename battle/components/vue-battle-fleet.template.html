<div class="fleet-section">
  <div class="fleet-header">
    <span class="fleet-dot" :style="{ background: accent }"></span>
    <h2>{{ fleet.name }}</h2>
    <span class="meta">{{ meta }}</span>
  </div>
  <div class="asset-grid">
    <battle-ship v-for="(ship, i) in fleet.ships" :key="i" :ship="ship" :fleet="fleet" :battle="battle" />
    <battle-company v-for="(company, i) in fleet.companies" :key="i" :company="company" :fleet="fleet" :battle="battle" />
  </div>
</div>
