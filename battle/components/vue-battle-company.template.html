<div class="company asset-card" :class="(company.destroyed || company.outOfFuel) ? 'dead is-dead' : ''">
  <div class="asset-card-head">
    <h4 class="asset-name">{{ company.aceType ? company.aceType + ' ace' : 'company' }}</h4>
    <span v-if="company.destroyed" class="badge badge-destroyed">Destroyed</span>
    <span v-else-if="company.outOfFuel" class="badge badge-fuel-out">Out of fuel</span>
    <span v-else class="badge badge-fuel-ok">Fueled</span>
    <button
      type="button"
      class="icon-btn"
      title="Fuel state"
      aria-label="Toggle fuel state"
      :disabled="company.destroyed"
      @click="fuelChange"
    >
      <svg viewBox="0 0 20 20" fill="none">
        <rect x="4" y="3" width="9" height="14" rx="1.5" stroke="currentColor" stroke-width="1.5" />
        <path d="M13 8h1.5a1.5 1.5 0 011.5 1.5V13a1 1 0 001 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        <path d="M7 7h5v4H7z" stroke="currentColor" stroke-width="1.3" />
      </svg>
    </button>
  </div>
  <span class="chip">{{ diceText }}</span>
  <span class="asset-meta">origin: {{ company.origin }}</span>
  <div class="system-list">
    <label v-for="(system, i) in company.systems" :key="i" class="system-row" :class="system.disabled ? 'is-disabled' : ''">
      <span class="system-icon" v-html="systemIcon(system.class)"></span>
      <span class="system-label">{{ system.class }}</span>
      <input
        class="system-check"
        type="checkbox"
        :checked="system.disabled"
        :disabled="company.outOfFuel"
        @click="systemStateChange(system, $event.target.checked)"
      />
    </label>
  </div>
</div>
