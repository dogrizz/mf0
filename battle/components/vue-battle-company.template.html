<div class="asset-card" data-kind="company" :class="{ 'is-dead': company.destroyed || company.outOfFuel }">
  <div class="asset-card-head">
    <span class="asset-name">{{ company.aceType ? company.aceType + ' ace' : 'company' }}</span>
    <span class="badge" :class="company.outOfFuel ? 'badge-fuel-out' : 'badge-fuel-ok'">{{ company.outOfFuel ? 'Out of fuel' : 'Fueled' }}</span>
    <button
      type="button"
      class="icon-btn"
      title="Fuel state"
      aria-label="Toggle fuel state"
      :disabled="company.destroyed"
      @click="fuelChange"
      v-html="fuelIconSvg"
    ></button>
  </div>
  <span class="chip">
    <template v-if="diceSegments.length">
      <span v-for="(segment, i) in diceSegments" :key="i" :class="'dice-' + segment.color">{{ segment.text }}</span>
    </template>
    <span v-else class="dice-empty">&mdash;</span>
  </span>
  <span class="asset-meta">origin: {{ company.origin }}</span>
  <div class="system-list">
    <label v-for="(system, i) in company.systems" :key="i" class="system-row" :class="{ 'is-disabled': system.disabled }">
      <span class="system-icon" v-html="systemIcon(system.class)"></span>
      <span class="system-label">{{ system.class }}</span>
      <input
        class="system-check"
        type="checkbox"
        :checked="system.disabled"
        :disabled="company.outOfFuel"
        @click="systemStateChange(system, $event.target.checked)"
      />
    </label>
  </div>
</div>
