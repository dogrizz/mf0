<div class="root">
  <div class="topbar">
    <div class="topbar-heading">
      <span class="eyebrow">MF0 &middot; Intercept Orbit</span>
      <h1 class="h1">Fleet builder</h1>
    </div>
    <options-link />
  </div>
  <div class="scoreboard-section">
    <div class="eyebrow">Scoreboard</div>
    <div class="scoreboard">
      <builder-player v-for="(player, i) in state.players" :key="i" :player="player" :state="state" :accent="fleetAccent(i)" />
    </div>
    <button type="button" class="btn btn-add" @click="addPlayer">Add player</button>
  </div>
  <button type="button" class="btn btn-primary btn-lg" :disabled="state.players.length === 0" @click="fight">Fight!</button>
  <div class="disclosure">
    <button type="button" class="btn disclosure-toggle" :aria-expanded="String(state.track)" @click="toggleTrackShips">
      <span class="disclosure-icon" :class="{ 'is-open': state.track }" v-html="chevronIconSvg"></span>
      Fleet builder
    </button>
    <div v-show="state.track" class="disclosure-body">
      <builder-ship-tracker :state="state" />
    </div>
  </div>
  <app-footer />
</div>
