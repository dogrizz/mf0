<div class="stat-card">
  <div class="stat-card-name">
    <span class="fleet-dot" :style="{ background: accent }"></span>
    <input class="stat-card-name-input" :value="player.name" @input="changeName($event.target.value)" />
    <button type="button" class="icon-btn" title="Remove player" aria-label="Remove player" @click="remove" v-html="removeIconSvg"></button>
  </div>
  <div class="field-row">
    <div class="field">
      <label>HVA</label>
      <input type="number" min="0" :value="player.hva" @input="changeHva($event.target.value)" />
    </div>
  </div>
  <div class="field-row">
    <div class="field">
      <label>TAs</label>
      <input type="number" min="0" :disabled="state.sync" :value="player.tas" @input="changeTas($event.target.value)" />
    </div>
    <div class="field">
      <label>Systems</label>
      <input type="number" min="0" :disabled="state.sync" :value="player.systems" @input="changeSystems($event.target.value)" />
    </div>
  </div>
  <span v-if="state.sync" class="field-note">Synced from ship data</span>
  <div class="stat-readout-row">
    <div class="stat-readout">
      <span class="stat-readout-value mono">{{ player.ppa }}</span>
      <span class="stat-readout-label">PPA</span>
    </div>
    <div class="stat-readout">
      <span class="stat-readout-value mono">{{ player.total }}</span>
      <span class="stat-readout-label">Total</span>
    </div>
  </div>
</div>
