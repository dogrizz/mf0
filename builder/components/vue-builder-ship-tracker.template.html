<div class="ship-tracker">
  <label class="check-toggle">
    <input class="sync-check" type="checkbox" :checked="state.sync" @click="setSync($event.target.checked)" />
    <span>Sync PPA calculations with fleet builder</span>
  </label>
  <div class="fleet-list">
    <builder-fleet v-for="(player, i) in state.players" :key="i" :fleet="player" :accent="fleetAccent(i)" />
  </div>
</div>
