<div class="asset-card" data-kind="ship">
  <div class="asset-card-head">
    <input class="asset-name-input" :value="ship.name" @input="changeName($event.target.value)" />
    <button type="button" class="icon-btn" title="Duplicate ship" aria-label="Duplicate ship" @click="duplicate" v-html="duplicateIconSvg"></button>
    <button type="button" class="icon-btn" title="Remove ship" aria-label="Remove ship" @click="remove" v-html="removeIconSvg"></button>
  </div>
  <div class="asset-card-row">
    <select class="field-select ship-class-select" :value="ship.class" @input="changeClass($event.target.value)">
      <option :value="ShipType.CAPITAL">Capital</option>
      <option :value="ShipType.FRIGATE">Frigate</option>
    </select>
    <span class="chip"><span v-for="(segment, i) in diceSegments" :key="i" :class="'dice-' + segment.color">{{ segment.text }}</span></span>
  </div>
  <div v-if="ship.hasOwnProperty('systems')" class="system-slot-list">
    <builder-system v-for="(system, i) in ship.systems" :key="i" :system="system" />
  </div>
  <builder-mech-companies :ship="ship" :fleet="fleet" />
</div>
