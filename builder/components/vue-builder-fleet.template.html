<div :id="'fleet-' + fleet.name" class="fleet-section">
  <div class="fleet-header">
    <span class="fleet-dot" :style="{ background: accent }"></span>
    <h2>{{ fleet.name }}</h2>
    <span class="meta">{{ meta }}</span>
  </div>
  <div class="asset-grid">
    <builder-ship v-for="(ship, i) in fleet.ships" :key="i" :ship="ship" :fleet="fleet" />
  </div>
  <button type="button" class="btn btn-add" @click="add">Add ship</button>
</div>
