<!DOCTYPE html>
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
		<link href="https://fonts.cdnfonts.com/css/sofia-sans" rel="stylesheet">
		<link rel="shortcut icon" type="image/x-icon" href="favicon.ico?">
	    <link rel="stylesheet" type="text/css" href="style.css">
		<meta charset="UTF-8">
	</head>
	<body data-bs-theme="dark" x-data="battlesPage()">
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
	    <script type="text/javascript" src="support.js"></script>
	    <script type="text/javascript" src="battles.js"></script>
	    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

	    <main class="container">
	    	<h1>MF0 Intercept Orbit battles</h1>
	    	<div class="battle list row row-cols-1 gap-3">
	    		<template x-if="entries.length === 0">
	    			<div>
	    				<span>No battles yet. Grab your bricks, dice and get to it!</span>
	    				<a href="index.html">Go to Fleet builder / PPA calculator</a>
	    			</div>
	    		</template>
	    		<template x-for="[id, battle] in entries" :key="id">
	    			<div class="battle col row align-items-center justify-content-start gap-2">
	    				<span class="col fs-5" x-text="`Battle from ${battleDate(battle)}`"></span>
	    				<a class="col-2 btn btn-outline-success" :href="battleUrl(id)">Resume</a>
	    				<button class="col-2 btn btn-outline-danger" @click="forfeit(id)">Forfeit</button>
	    			</div>
	    		</template>
	    	</div>
	    	<footer class="float-end" style="font-size: small">
	    		<span>Please </span><a target="_blank" href="https://www.patreon.com/Joshua">support MF0 creator</a><span> or </span><a target="_blank" href="https://glyphpress.com/talk/mobile-frame-zero-002-intercept-orbit-final-pdf">buy a rulebook</a>
	    		<div style="font-size: smaller"><span>I am not the creator ;)</span></div>
	    	</footer>
	    </main>
	</body>
</html>
